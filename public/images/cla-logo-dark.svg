<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 165" width="100%" height="100%" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Seamless 45-degree architectural cross-hatch pattern with 100% transparent background -->
    <pattern id="hatch-dark" width="4.5" height="4.5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="4.5" stroke="#111111" stroke-width="0.6" opacity="0.85" />
      <line x1="0" y1="0" x2="4.5" y2="0" stroke="#111111" stroke-width="0.6" opacity="0.85" />
    </pattern>
  </defs>

  <!-- ARCHITECTURAL DRAFTING BLUEPRINT GRID LINES -->
  <g stroke="#111111" stroke-width="0.75" opacity="0.45">
    <!-- Horizontal Guidelines -->
    <line x1="6" y1="66" x2="208" y2="66" />
    <line x1="6" y1="103" x2="208" y2="103" />
    <line x1="6" y1="140" x2="422" y2="140" />

    <!-- Vertical Guidelines -->
    <line x1="14" y1="32" x2="14" y2="162" />
    <line x1="54" y1="32" x2="54" y2="162" />
    <line x1="90" y1="4" x2="90" y2="162" />
    <line x1="108" y1="4" x2="108" y2="162" />
    <line x1="118" y1="32" x2="118" y2="162" />
    <line x1="148" y1="32" x2="148" y2="162" />
    <line x1="178" y1="32" x2="178" y2="162" />
    <line x1="194" y1="32" x2="194" y2="162" />
    <line x1="208" y1="32" x2="208" y2="162" />

    <!-- 'l' Top Tick Guide -->
    <line x1="82" y1="25" x2="116" y2="25" />
  </g>

  <!-- GLYPH 'c' (Annular arc filled only with transparent cross-hatch; center and wedge are 100% transparent) -->
  <path d="M 80.16 76.84 A 37 37 0 1 0 80.16 129.16 L 67.44 116.44 A 19 19 0 1 1 67.44 89.56 Z"
        fill="url(#hatch-dark)"
        stroke="#111111"
        stroke-width="1.1"
        stroke-linejoin="round" />
  <!-- Diagonal slice lines to center -->
  <line x1="54" y1="103" x2="80.16" y2="76.84" stroke="#111111" stroke-width="1.0" />
  <line x1="54" y1="103" x2="80.16" y2="129.16" stroke="#111111" stroke-width="1.0" />
  <circle cx="54" cy="103" r="1" fill="#111111" />

  <!-- GLYPH 'l' -->
  <!-- Top Yellow Solid Accent -->
  <rect x="90" y="25" width="18" height="68" fill="#D99200" stroke="#111111" stroke-width="1.1" stroke-linejoin="round" />
  <!-- Bottom Transparent Hatch Segment -->
  <rect x="90" y="93" width="18" height="47" fill="url(#hatch-dark)" stroke="#111111" stroke-width="1.1" stroke-linejoin="round" />

  <!-- GLYPH 'a' (Circular Donut with 100% transparent center hole, filled only with transparent cross-hatch) -->
  <path d="M 111 103 A 37 37 0 1 0 185 103 A 37 37 0 1 0 111 103 M 129 103 A 19 19 0 1 1 167 103 A 19 19 0 1 1 129 103 Z"
        fill="url(#hatch-dark)"
        fill-rule="evenodd"
        stroke="#111111"
        stroke-width="1.1"
        stroke-linejoin="round" />
  <!-- Right Yellow Solid Accent Bar -->
  <rect x="178" y="66" width="16" height="74" fill="#D99200" stroke="#111111" stroke-width="1.1" stroke-linejoin="round" />

  <!-- BRAND TYPOGRAPHY -->
  <g font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', -apple-system, sans-serif">
    <text x="218" y="67" fill="#111111" font-size="23" font-weight="800" letter-spacing="0.24em">CREATIVE</text>
    <text x="218" y="98" fill="#111111" font-size="23" font-weight="800" letter-spacing="0.24em">LAYERS</text>
    <text x="218" y="129" fill="#D99200" font-size="23" font-weight="800" letter-spacing="0.25em">ARCHITECTS</text>
    <text x="218" y="157" fill="#444444" font-size="14" font-weight="400" letter-spacing="0.03em">creating places for people</text>
  </g>
</svg>